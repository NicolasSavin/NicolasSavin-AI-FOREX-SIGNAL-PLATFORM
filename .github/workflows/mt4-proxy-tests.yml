name: MT4 proxy tests

on:
  pull_request:
    paths:
      - "app/api/mt4_orderflow_proxy.py"
      - "app/main.py"
      - "tests/test_mt4_orderflow_proxy.py"
      - ".github/workflows/mt4-proxy-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install fastapi==0.115.0 httpx==0.27.2 requests==2.32.3 pytest==8.3.5
      - run: pytest -q tests/test_mt4_orderflow_proxy.py
